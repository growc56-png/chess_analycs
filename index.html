<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шахматный тренажёр 800 → 1300</title>
<link rel="stylesheet" href="css/chessboard-1.0.0.min.css">
<script src="js/jquery.min.js"></script>
<script src="js/chessboard-1.0.0.min.js"></script>
<script src="js/chess.min.js"></script>

<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #141414; color: #e8e8e8; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .subtitle { color: #888; font-size: 14px; }
  .today-banner { background: #1e1e1e; border: 1px solid #333; padding: 8px 16px; border-radius: 8px; font-size: 14px; color: #4ade80; white-space: nowrap; }
  .today-banner span { color: #fff; font-weight: 600; }
  #error-banner { display: none; background: #7f1d1d; color: #fff; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; line-height: 1.4; }
  
  #recommendations-banner { display: none; background: #1e1e1e; border: 1px solid #b45309; border-left: 5px solid #f59e0b; border-radius: 8px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
  #recommendations-banner h3 { margin: 0 0 10px; color: #fcd34d; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  #recommendations-banner ul { margin: 0; padding-left: 20px; color: #e8e8e8; font-size: 14px; line-height: 1.6; }
  #recommendations-banner li { margin-bottom: 5px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 18px; border-bottom: 1px solid #2a2a2a; padding-bottom: 8px; }
  .tab-btn { background: none; border: none; color: #999; padding: 8px 16px; cursor: pointer; font-size: 14px; border-radius: 6px; }
  .tab-btn.active { background: #262626; color: #fff; font-weight: 600; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  
  /* Стили плана */
  .progress-bar { background: #262626; border-radius: 8px; height: 18px; overflow: hidden; margin-bottom: 6px; }
  .progress-fill { background: linear-gradient(90deg, #4ade80, #22c55e); height: 100%; width: 0; transition: width 0.4s; }
  .progress-text { color: #999; font-size: 12px; margin-bottom: 22px; }
  .layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
  @media (max-width: 820px) { .layout, .split { grid-template-columns: 1fr !important; } }
  .phase { background: #1e1e1e; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; border-left: 3px solid #3b82f6; }
  .phase-title { font-weight: 600; font-size: 13px; margin-bottom: 3px; }
  .phase-meta { color: #888; font-size: 11px; }
  .week-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
  .week-btn { background: #262626; border: none; color: #ccc; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .week-btn.active { background: #4ade80; color: #111; font-weight: 600; }
  .day-card { background: #1e1e1e; border-radius: 10px; padding: 18px; }
  .day-card.done { opacity: 0.65; }
  .day-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .day-title { font-size: 17px; font-weight: 600; }
  .day-sub { color: #999; font-size: 12px; margin-top: 2px; }
  .checkbox { width: 22px; height: 22px; cursor: pointer; accent-color: #4ade80; }
  .task { background: #161616; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; border-left: 3px solid #555; }
  .task.tactics { border-left-color: #f59e0b; } .task.endgame { border-left-color: #3b82f6; } .task.opening { border-left-color: #a855f7; }
  .task.game { border-left-color: #ef4444; } .task.review { border-left-color: #10b981; } .task.strategy { border-left-color: #06b6d4; } .task.rest { border-left-color: #6b7280; }
  .task-title { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .task-detail { color: #aaa; font-size: 12px; line-height: 1.45; }
  .task-meta { color: #666; font-size: 11px; margin-top: 6px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .task-meta a { color: #60a5fa; text-decoration: none; }
  .checklist-btn { background: #2a2a2a; border: 1px solid #444; color: #ccc; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: 0.2s; }
  .checklist-btn:hover { background: #333; color: #fff; border-color: #555; }
  .checklist-btn.active { background: #4ade80; color: #111; border-color: #4ade80; font-weight: bold; }
  .checklist-container { display: none; margin-top: 10px; background: #1e1e1e; border-radius: 6px; padding: 10px; border: 1px solid #2a2a2a; }
  .checklist-container.open { display: block; }
  .checklist-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .checklist-item:last-child { margin-bottom: 0; }
  .checklist-item input { margin-top: 3px; accent-color: #4ade80; cursor: pointer; }
  .checklist-item label { font-size: 12px; color: #bbb; cursor: pointer; line-height: 1.4; user-select: none; }
  .checklist-item input:checked + label { color: #666; text-decoration: line-through; }
  .note-area { width: 100%; background: #161616; border: 1px solid #2a2a2a; border-radius: 8px; color: #e8e8e8; padding: 10px; font-family: inherit; font-size: 12px; resize: vertical; margin-top: 12px; min-height: 60px; }
  .nav-buttons { display: flex; gap: 8px; margin-bottom: 12px; }
  .nav-btn { background: #262626; border: none; color: #ddd; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .split { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
  .list-box { background: #1e1e1e; border-radius: 10px; padding: 10px; overflow-y: auto; }
  .list-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .list-item:hover { background: #262626; }
  .list-item.active { background: #333; font-weight: 600; }
  .family-header { font-size: 12px; color: #4ade80; font-weight: 600; padding: 8px 4px 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .board-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  
  #puzzleBoard, #openingBoard { width: 400px; max-width: 100%; }
  
  .highlight-move::after { content: ''; position: absolute; top: 35%; left: 35%; width: 30%; height: 30%; background: rgba(74, 222, 128, 0.6); border-radius: 50%; z-index: 10; pointer-events: none; }
  .highlight-capture::after { content: ''; position: absolute; top: 5%; left: 5%; width: 90%; height: 90%; border: 4px solid rgba(239, 68, 68, 0.7); border-radius: 50%; z-index: 10; pointer-events: none; }
  .square-55d63 { position: relative; }
  .variation-active { box-shadow: 0 0 15px 5px rgba(74, 222, 128, 0.4); border-radius: 4px; }

  .brilliant-anim::after { content: '!!'; position: absolute; top: -10px; right: -10px; background: #0f766e; color: #fff; font-weight: bold; font-size: 14px; padding: 2px 6px; border-radius: 4px; animation: pop 0.5s ease-out; z-index: 20; pointer-events: none; }
  .excellent-anim::after { content: '!'; position: absolute; top: -10px; right: -10px; background: #15803d; color: #fff; font-weight: bold; font-size: 14px; padding: 2px 6px; border-radius: 4px; animation: pop 0.5s ease-out; z-index: 20; pointer-events: none; }
  @keyframes pop { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

  .feedback { font-size: 14px; font-weight: 600; min-height: 22px; text-align: center; }
  .feedback.ok { color: #4ade80; } .feedback.err { color: #f87171; }
  .hint { color: #888; font-size: 12px; text-align: center; max-width: 400px; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
  .action-btn { background: #262626; border: none; color: #ddd; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .action-btn:hover { background: #333; }
  .opening-desc { background: #1e1e1e; border-radius: 8px; padding: 14px; font-size: 13px; line-height: 1.55; margin-top: 10px; width: 100%; max-width: 500px; }
  .opening-desc strong { color: #4ade80; }
  .opening-desc p { margin: 0 0 8px; }
  .move-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .move-chip { background: #262626; color: #aaa; padding: 5px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; margin-bottom: 4px; }
  .move-chip:hover { background: #333; color: #fff; }
  .move-chip.current { background: #4ade80; color: #111; font-weight: 600; }
  .side-toggle { display: flex; gap: 6px; margin-bottom: 15px; }
  .side-btn { background: #1e1e1e; border: 1px solid #333; color: #ccc; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
  .side-btn:hover { background: #262626; }
  .side-btn.active { background: #4ade80; border-color: #4ade80; color: #111; font-weight: bold; }
  
  /* НОВЫЙ ДИЗАЙН АНАЛИЗА */
  .analysis-container { display: grid; grid-template-columns: 1fr 400px; gap: 20px; align-items: start; }
  @media (max-width: 1000px) { .analysis-container { grid-template-columns: 1fr; } }
  
  .left-panel { display: flex; gap: 15px; }
  .board-area { position: relative; }
  #analysisBoard { width: 500px; max-width: 100%; }
  #arrowOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  
  /* Вертикальная полоса оценки */
  .eval-bar-wrapper { display: flex; flex-direction: column; align-items: center; width: 30px; margin-right: 10px; }
  .eval-bar-vertical { width: 100%; height: 500px; background: #262626; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #444; position: relative; }
  .eval-bar-white { background: #f0f0f0; width: 100%; transition: height 0.3s; position: absolute; bottom: 0; left: 0; }
  .eval-text { font-size: 12px; font-weight: bold; color: #ccc; text-align: center; margin-top: 5px; }

  .right-panel { display: flex; flex-direction: column; gap: 15px; height: calc(100vh - 150px); min-height: 600px; }
  
  /* График */
  .graph-container { background: #1e1e1e; border-radius: 8px; padding: 10px; border: 1px solid #2a2a2a; }
  canvas#evalGraph { width: 100%; height: 100px; display: block; }
  
  /* Топ-линии */
  .top-lines { background: #1e1e1e; border-radius: 8px; padding: 12px; border: 1px solid #2a2a2a; }
  .top-line { display: flex; justify-content: space-between; padding: 8px 6px; border-bottom: 1px solid #2a2a2a; font-size: 13px; cursor: pointer; border-radius: 4px; }
  .top-line:hover { background: #2a2a2a; }
  .top-line:last-child { border-bottom: none; }
  .top-line-move { font-weight: bold; min-width: 50px; }
  .top-line-pv { color: #aaa; flex: 1; margin: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: monospace; }
  .top-line-eval { font-weight: bold; }

  /* Таблица ходов */
  .move-table-container { flex: 1; overflow-y: auto; background: #1e1e1e; border-radius: 8px; border: 1px solid #2a2a2a; }
  .move-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .move-table th { text-align: left; padding: 8px 6px; border-bottom: 1px solid #333; color: #888; font-weight: normal; position: sticky; top: 0; background: #1e1e1e; z-index: 2; }
  .move-table td { padding: 6px; border-bottom: 1px solid #2a2a2a; }
  .move-table tr:hover { background: #2a2a2a; cursor: pointer; }
  .move-table tr.active { background: #333; }
  
  .move-class-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-left: 6px; cursor: help; text-align: center; min-width: 30px; }
  .cls-brilliant { background: #0f766e; color: #4ade80; }
  .cls-great { background: #15803d; color: #bbf7d0; }
  .cls-best { background: #166534; color: #bbf7d0; }
  .cls-excellent { background: #4d7c0f; color: #fef08a; }
  .cls-good { background: #4d7c0f; color: #fef08a; }
  .cls-book { background: #4d4d4d; color: #d4d4d4; }
  .cls-inaccuracy { background: #b45309; color: #fef3c7; }
  .cls-mistake { background: #b91c1c; color: #fecaca; }
  .cls-blunder { background: #7f1d1d; color: #fecaca; }
  .cls-miss { background: #b45309; color: #fef3c7; }
  .cls-forced { background: #333; color: #fff; }

  .chesscom-input-group { display: flex; gap: 10px; margin-bottom: 15px; background: #1e1e1e; padding: 15px; border-radius: 8px; }
  .chesscom-input-group input { flex: 1; background: #141414; border: 1px solid #333; border-radius: 6px; padding: 10px; color: #fff; font-size: 14px; }
  .chesscom-games-list { max-height: 200px; overflow-y: auto; border: 1px solid #2a2a2a; border-radius: 6px; background: #141414; margin-bottom: 15px; }
  .chesscom-game-card { padding: 10px 12px; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-left: 3px solid transparent; }
  .chesscom-game-card:hover { background: #1e1e1e; }
  .chesscom-game-card:last-child { border-bottom: none; }
  .game-info { display: flex; flex-direction: column; gap: 4px; }
  .game-opponent { font-weight: 600; font-size: 13px; }
  .game-meta { font-size: 11px; color: #888; display: flex; gap: 10px; }
  .game-result { font-weight: bold; font-size: 12px; padding: 3px 8px; border-radius: 4px; }
  .game-result.win { background: #166534; color: #bbf7d0; }
  .game-result.loss { background: #7f1d1d; color: #fecaca; }
  .game-result.draw { background: #4d4d4d; color: #d4d4d4; }
  .game-accuracy { font-size: 12px; color: #4ade80; font-weight: bold; }

  .player-name { font-weight: bold; background: #1e1e1e; padding: 8px 12px; border-radius: 4px; text-align: left; width: 500px; max-width: 100%; border: 1px solid #333; font-size: 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .captured-pieces { font-size: 16px; color: #888; letter-spacing: -2px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>Шахматный тренажёр: 800 → 1300</h1>
      <div class="subtitle">План на 16 недель · Задачи · Дебюты · Анализ</div>
    </div>
    <div class="today-banner" id="today-date">Загрузка даты...</div>
  </div>

  <div id="error-banner"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="plan">План</button>
    <button class="tab-btn" data-tab="puzzles">Задачи</button>
    <button class="tab-btn" data-tab="openings">Дебюты</button>
    <button class="tab-btn" data-tab="analysis">Анализ</button>
  </div>

  <!-- ПЛАН -->
  <div id="tab-plan" class="tab-content active">
    <div id="recommendations-banner">
      <h3>💡 Персональные рекомендации:</h3>
      <ul id="recommendations-list"></ul>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText"></div>
    <div class="layout">
      <aside><div id="phases"></div><div class="week-list" id="weeks"></div></aside>
      <main>
        <div class="nav-buttons">
          <button class="nav-btn" id="prevBtn">← Предыдущий</button>
          <button class="nav-btn" id="nextBtn">Следующий →</button>
          <button class="nav-btn" id="todayBtn">К сегодняшнему дню</button>
        </div>
        <div id="dayView"></div>
      </main>
    </div>
  </div>

  <!-- ЗАДАЧИ -->
  <div id="tab-puzzles" class="tab-content">
    <div class="split">
      <div class="list-box" id="puzzleList" style="max-height: 500px;">Загрузка...</div>
      <div>
        <div class="board-wrap">
          <div id="puzzleBoard"></div>
          <div id="puzzleFeedback" class="feedback"></div>
          <div id="puzzleHint" class="hint"></div>
          <div class="btn-row">
            <button class="action-btn" id="puzzleResetBtn">↺ Сбросить</button>
            <button class="action-btn" id="puzzleHintBtn">💡 Подсказка</button>
            <button class="action-btn" id="puzzleSolutionBtn">Показать решение</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ДЕБЮТЫ -->
  <div id="tab-openings" class="tab-content">
    <div class="side-toggle">
      <button class="side-btn active" data-side="white">♔ За белых</button>
      <button class="side-btn" data-side="black">♚ За чёрных</button>
    </div>
    <div class="split">
      <div class="list-box" id="openingList" style="max-height: 500px;">Загрузка...</div>
      <div>
        <div class="board-wrap">
          <div id="openingBoard"></div>
          <div class="btn-row" id="openingNav" style="display:none;">
            <button class="action-btn" id="openingStart">⏮ В начало</button>
            <button class="action-btn" id="openingPrev">← Назад</button>
            <button class="action-btn" id="openingNext">Вперёд →</button>
            <button class="action-btn" id="openingEnd">В конец ⏭</button>
          </div>
          <div class="opening-desc" id="openingDesc"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- АНАЛИЗ -->
  <div id="tab-analysis" class="tab-content">
    
    <div class="chesscom-input-group">
      <input type="text" id="chesscomUsername" placeholder="Ник на Chess.com" />
      <button class="action-btn" id="loadGamesBtn" style="background: #4ade80; color: #111; font-weight: bold;">Найти игры</button>
    </div>
    <div id="chesscomGamesList" class="chesscom-games-list" style="display: none;"></div>

    <div class="analysis-container">
      <!-- Левая часть: Доска, оценка, стрелки -->
      <div class="left-panel">
        <div class="eval-bar-wrapper">
          <div class="eval-text" id="evalText">0.0</div>
          <div class="eval-bar-vertical">
            <div class="eval-bar-white" id="evalBarWhite" style="height: 50%;"></div>
          </div>
        </div>
        <div>
          <div id="topPlayer" class="player-name">
            <span>Black Player</span><span class="captured-pieces"></span>
          </div>
          <div class="board-area">
            <div id="analysisBoard"></div>
            <svg id="arrowOverlay"></svg>
          </div>
          <div id="bottomPlayer" class="player-name" style="margin-top: 5px;">
            <span>White Player</span><span class="captured-pieces"></span>
          </div>
          <div class="btn-row" style="justify-content: space-between; margin-top: 10px;">
            <button class="action-btn" id="analysisStart">⏮</button>
            <button class="action-btn" id="analysisPrev">← Назад</button>
            <button class="action-btn" id="analysisNext">Вперёд →</button>
            <button class="action-btn" id="analysisEnd">⏭</button>
            <button class="action-btn" id="flipBoardBtn">🔄 Перевернуть</button>
          </div>
        </div>
      </div>

      <!-- Правая часть: График, Линии, Ходы -->
      <div class="right-panel">
        <div class="graph-container">
          <canvas id="evalGraph" width="380" height="100"></canvas>
        </div>

        <div class="top-lines">
          <div style="font-size:12px; color:#888; margin-bottom:8px;">Топ-3 линии (кликни, чтобы поставить):</div>
          <div id="topLinesList" style="color:#666;">Выберите игру...</div>
        </div>
        
        <div class="move-table-container">
          <table class="move-table" id="moveTable">
            <thead><tr><th>№</th><th>Ход</th><th>Оценка</th><th>Класс</th></tr></thead>
            <tbody id="moveTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// --- Общая логика ---
const daysMap = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
const monthsMap = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

function getTodayInfo() {
  const now = new Date();
  const dayName = daysMap[now.getDay()];
  document.getElementById('today-date').innerHTML = `Сегодня: <span>${dayName}</span>, ${now.getDate()} ${monthsMap[now.getMonth()]} ${now.getFullYear()} г.`;
  return dayName;
}

function showError(msg) {
  const banner = document.getElementById('error-banner');
  banner.style.display = 'block';
  banner.innerHTML = msg;
}

window.addEventListener('load', () => {
  if (typeof jQuery === 'undefined') return showError('Ошибка: jQuery не загрузился.');
  if (typeof Chessboard === 'undefined') return showError('Ошибка: Chessboard.js не загрузился.');
  if (typeof Chess === 'undefined') return showError('Ошибка: Chess.js не загрузился.');
  initApp();
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'puzzles' && puzzleBoard) setTimeout(() => puzzleBoard.resize(), 50);

const unicodePieces = { P: '♙', N: '♘', B: '♗', R: '♖', Q: '♕', p: '♟', n: '♞', b: '♝', r: '♜', q: '♛' };

function updatePlayerNamesAndMaterial(fen) {
  const board = new Chess(fen).board();
  const initialPieces = { p: 8, n: 2, b: 2, r: 2, q: 1, k: 1 };
  const currentWhite = { p: 0, n: 0, b: 0, r: 0, q: 0, k: 0 };
  const currentBlack = { p: 0, n: 0, b: 0, r: 0, q: 0, k: 0 };
  
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const piece = board[r][c];
      if (piece) {
        if (piece.color === 'w') currentWhite[piece.type]++;
        else currentBlack[piece.type]++;
      }
    }
  }
  
  const values = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
  let whiteScore = 0, blackScore = 0;
  let whiteCaptured = [], blackCaptured = [];
  
  for (const type in initialPieces) {
    if (type === 'k') continue;
    whiteScore += currentWhite[type] * values[type];
    blackScore += currentBlack[type] * values[type];
    
    for (let i = 0; i < initialPieces[type] - currentWhite[type]; i++) blackCaptured.push(`w${type.toUpperCase()}`);
    for (let i = 0; i < initialPieces[type] - currentBlack[type]; i++) whiteCaptured.push(`b${type.toUpperCase()}`);
  }
  
  const diff = whiteScore - blackScore;
  const whiteAdvStr = diff > 0 ? ` <span style="color:#4ade80;">+${diff}</span>` : '';
  const blackAdvStr = diff < 0 ? ` <span style="color:#4ade80;">+${Math.abs(diff)}</span>` : '';
  
  const whiteCapturedStr = whiteCaptured.map(p => unicodePieces[p]).join('');
  const blackCapturedStr = blackCaptured.map(p => unicodePieces[p]).join('');
  
  const whiteDisplay = `${currentWhitePlayer}${whiteAdvStr}`;
  const blackDisplay = `${currentBlackPlayer}${blackAdvStr}`;
  
  const topEl = document.getElementById('topPlayer');
  const bottomEl = document.getElementById('bottomPlayer');
  
  if (isBoardFlipped) {
    topEl.innerHTML = `<span>${whiteDisplay}</span><span class="captured-pieces">${whiteCapturedStr}</span>`;
    bottomEl.innerHTML = `<span>${blackDisplay}</span><span class="captured-pieces">${blackCapturedStr}</span>`;
  } else {
    topEl.innerHTML = `<span>${blackDisplay}</span><span class="captured-pieces">${blackCapturedStr}</span>`;
    bottomEl.innerHTML = `<span>${whiteDisplay}</span><span class="captured-pieces">${whiteCapturedStr}</span>`;
  }
}

// --- СТРЕЛКИ ---
function drawArrows(lines) {
  const svg = document.getElementById('arrowOverlay');
  svg.innerHTML = ''; // Очищаем
  if (!lines || lines.length === 0) return;
  
  const boardWidth = document.getElementById('analysisBoard').offsetWidth;
  const squareSize = boardWidth / 8;
  const files = ['a','b','c','d','e','f','g','h'];
  
  lines.forEach((line, index) => {
    const from = line.uci.substring(0, 2);
    const to = line.uci.substring(2, 4);
    
    let startX = (files.indexOf(from[0]) * squareSize) + squareSize / 2;
    let startY = ((8 - parseInt(from[1])) * squareSize) + squareSize / 2;
    let endX = (files.indexOf(to[0]) * squareSize) + squareSize / 2;
    let endY = ((8 - parseInt(to[1])) * squareSize) + squareSize / 2;
    
    if (isBoardFlipped) {
      startX = boardWidth - startX;
      startY = boardWidth - startY;
      endX = boardWidth - endX;
      endY = boardWidth - endY;
    }
    
    const thickness = index === 0 ? 10 : (index === 1 ? 6 : 3);
    const color = index === 0 ? 'rgba(74, 222, 128, 0.9)' : (index === 1 ? 'rgba(59, 130, 246, 0.8)' : 'rgba(168, 85, 247, 0.7)');
    
    // Рисуем линию
    const lineEl = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    lineEl.setAttribute('x1', startX);
    lineEl.setAttribute('y1', startY);
    lineEl.setAttribute('x2', endX);
    lineEl.setAttribute('y2', endY);
    lineEl.setAttribute('stroke', color);
    lineEl.setAttribute('stroke-width', thickness);
    lineEl.setAttribute('stroke-linecap', 'round');
    lineEl.setAttribute('marker-end', `url(#arrowhead${index})`);
    svg.appendChild(lineEl);
    
    // Рисуем наконечник стрелки
    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
    marker.setAttribute('id', `arrowhead${index}`);
    marker.setAttribute('markerWidth', '4');
    marker.setAttribute('markerHeight', '4');
    marker.setAttribute('refX', '2');
    marker.setAttribute('refY', '2');
    marker.setAttribute('orient', 'auto');
    
    const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    polygon.setAttribute('points', '0,0 4,2 0,4');
    polygon.setAttribute('fill', color);
    
    marker.appendChild(polygon);
    defs.appendChild(marker);
    svg.appendChild(defs);
  });
}

function drawGraph(evals) {
  const canvas = document.getElementById('evalGraph');
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  
  ctx.clearRect(0, 0, w, h);
  if (!evals || evals.length === 0) return;
  
  // Фон
  ctx.fillStyle = '#333';
  ctx.fillRect(0, 0, w, h);
  
  // Белая часть
  ctx.fillStyle = '#eee';
  ctx.fillRect(0, 0, w, h / 2);
  
  const step = w / (evals.length || 1);
  
  ctx.beginPath();
  ctx.moveTo(0, h / 2); // Начало по центру
  
  for (let i = 0; i < evals.length; i++) {
    const x = i * step;
    // Ограничиваем от -10 до +10
    let evalVal = Math.max(-10, Math.min(10, evals[i]));
    // Инвертируем Y (ось Y идет вниз)
    let y = (h / 2) - (evalVal / 10 * (h / 2)); 
    
    ctx.lineTo(x, y);
  }
  
  ctx.lineTo(w, h / 2); // Конец по центру
  ctx.strokeStyle = '#4ade80';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // Заливка
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.fillStyle = 'rgba(74, 222, 128, 0.2)';
  ctx.fill();
}

function selectPuzzle(puzzle) {
  currentPuzzle = puzzle;
  puzzleSolved = false;
  clearHighlights();
  document.querySelectorAll('#puzzleList .list-item').forEach(i => i.classList.remove('active'));
  const el = document.querySelector(`#puzzleList .list-item[data-id="${puzzle.id}"]`);
  if (el) el.classList.add('active');
  puzzleGame = new Chess(puzzle.fen);

  if (!puzzleBoard) {
    puzzleBoard = Chessboard('puzzleBoard', {
      position: puzzle.fen, draggable: true,
      onDragStart: (source, piece) => {
        const turn = puzzleGame.turn() === 'w' ? 'w' : 'b';
        if ((turn === 'w' && piece.search(/^b/) !== -1) || (turn === 'b' && piece.search(/^w/) !== -1)) return false;
        highlightMoves(puzzleGame, source);
      },
      onDrop: handlePuzzleDrop, onSnapEnd: () => clearHighlights(), pieceTheme: PIECE_THEME
    });
  } else {
    puzzleBoard.position(puzzle.fen); puzzleBoard.resize();
  }
  setFeedback('', ''); document.getElementById('puzzleHint').textContent = '';
}

function handlePuzzleDrop(source, target) {
  if (!currentPuzzle || puzzleSolved) return 'snapback';
  const move = puzzleGame.move({ from: source, to: target, promotion: 'q' });
  if (!move) return 'snapback';
  if (source + target === currentPuzzle.solution) {
    puzzleSolved = true; puzzleBoard.position(puzzleGame.fen());
    setFeedback('✅ Верно! Это мат.', 'ok'); return;
  } else {
    puzzleGame.undo(); setFeedback('❌ Неверно, попробуй другой ход.', 'err'); return 'snapback';
  }
}

function setFeedback(text, cls) { const fb = document.getElementById('puzzleFeedback'); fb.textContent = text; fb.className = 'feedback ' + cls; }

document.getElementById('puzzleSolutionBtn').onclick = () => {
  if (!currentPuzzle) return;
  const from = currentPuzzle.solution.slice(0, 2), to = currentPuzzle.solution.slice(2, 4);
  const mv = puzzleGame.move({ from, to, promotion: 'q' });
  if (mv) { puzzleSolved = true; puzzleBoard.position(puzzleGame.fen()); setFeedback('Решение показано.', 'ok'); }
};

function initAnalysis() {
  analysisBoard = Chessboard('analysisBoard', {
    position: 'start', draggable: true,
    onDragStart: (source, piece) => {
      if (isAnalyzing) return false;
      const turn = analysisGame.turn() === 'w' ? 'w' : 'b';
      if ((turn === 'w' && piece.search(/^b/) !== -1) || (turn === 'b' && piece.search(/^w/) !== -1)) return false;
      highlightMoves(analysisGame, source);
    },
    onDrop: handleAnalysisDrop, onSnapEnd: () => clearHighlights(), pieceTheme: PIECE_THEME
  });

  document.getElementById('flipBoardBtn').onclick = () => {
    analysisBoard.flip();
    isBoardFlipped = !isBoardFlipped;
    updatePlayerNamesAndMaterial(analysisGame.fen());
    drawArrows(analysisMoves[currentAnalysisIndex]?.next_top_moves);
  };

  document.getElementById('loadGamesBtn').onclick = async () => {
    const username = document.getElementById('chesscomUsername').value.trim();
    if (!username) return alert('Введи ник на Chess.com');
    const btn = document.getElementById('loadGamesBtn'); btn.disabled = true; btn.textContent = 'Загрузка...';
    const listContainer = document.getElementById('chesscomGamesList');
    listContainer.style.display = 'block';
    listContainer.innerHTML = '<p style="color: #888; padding: 10px;">Загрузка игр...</p>';

    try {
      const archivesRes = await fetch(`https://api.chess.com/pub/player/${username}/games/archives`);
      if (!archivesRes.ok) {
        if (archivesRes.status === 404) throw new Error('Игрок не найден.');
        throw new Error('Ошибка доступа к API.');
      }
      const archivesData = await archivesRes.json();
      const archives = archivesData.archives || [];
      if (archives.length === 0) { listContainer.innerHTML = '<p style="color: #888; padding: 10px;">Игры не найдены.</p>'; return; }

      const recentArchives = archives.slice(-2);
      let allGames = [];
      for (const url of recentArchives) {
        const monthRes = await fetch(url);
        if (monthRes.ok) {
          const monthData = await monthRes.json();
          allGames = allGames.concat(monthData.games || []);
        }
      }
      allGames.sort((a, b) => b.end_time - a.end_time);
      allGames = allGames.slice(0, 50);
      if (allGames.length === 0) { listContainer.innerHTML = '<p style="color: #888; padding: 10px;">Игры не найдены.</p>'; return; }

      listContainer.innerHTML = '';
      allGames.forEach((game) => {
        const white = game.white;
        const black = game.black;
        let myResult = '';
        let opponent = '';
        const userLower = username.toLowerCase();

        if (white.username.toLowerCase() === userLower) { myResult = white.result; opponent = black.username; }
        else { myResult = black.result; opponent = white.username; }

        let gameResult = '';
        if (myResult === 'win') gameResult = 'Победа';
        else if (['checkmated', 'resigned', 'timeout', 'abandoned'].includes(myResult)) gameResult = 'Поражение';
        else gameResult = 'Ничья';

        let resultClass = 'draw';
        if (gameResult === 'Победа') resultClass = 'win';
        else if (gameResult === 'Поражение') resultClass = 'loss';

        const date = new Date(game.end_time * 1000).toLocaleDateString();
        const accuracyStr = game.accuracies ? (white.username.toLowerCase() === userLower ? game.accuracies.white : game.accuracies.black) : '—';

        const card = document.createElement('div');
        card.className = 'chesscom-game-card';
        card.innerHTML = `<div class="game-info"><div class="game-opponent">vs ${opponent} (${game.time_class})</div><div class="game-meta"><span>${date}</span><span>Точность: <span class="game-accuracy">${accuracyStr ? accuracyStr + '%' : '—'}</span></span></div></div><div class="game-result ${resultClass}">${gameResult}</div>`;

        card.onclick = () => {
          document.querySelectorAll('.chesscom-game-card').forEach(c => c.style.borderLeftColor = 'transparent');
          card.style.borderLeftColor = '#4ade80';
          analysisBoard.orientation('white');
          isBoardFlipped = false;

          currentWhitePlayer = white.username;
          currentBlackPlayer = black.username;
          updatePlayerNamesAndMaterial(new Chess().fen());

          analyzePGN(game.pgn);
          document.getElementById('analysisBoard').scrollIntoView({ behavior: 'smooth', block: 'center' });
        };
        listContainer.appendChild(card);
      });

    } catch (e) {
      listContainer.innerHTML = `<p style="color: #f87171; padding: 10px;">Ошибка: ${e.message}<br><br><strong>Включите VPN, если сайт блокируется.</strong></p>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Найти игры';
    }
  };
}

function playMoveSound() {
  moveSound.currentTime = 0;
  moveSound.play().catch(e => console.log("Звук не воспроизведен:", e));
}

async function analyzePGN(pgn) {
  document.getElementById('evalText').textContent = 'Анализ...';
  document.getElementById('topLinesList').innerHTML = '<span style="color:#4ade80;">Анализ... Это может занять 10-20 секунд.</span>';
  document.getElementById('moveTableBody').innerHTML = '';
  document.getElementById('arrowOverlay').innerHTML = '';
  isAnalyzing = true;
  try {
    const res = await fetch('/api/analyze', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({pgn}) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Ошибка анализа');
    analysisMoves = data.moves; 
    fullEvals = data.evals; // Сохраняем для графика
    
    currentWhitePlayer = data.white_player || "White";
    currentBlackPlayer = data.black_player || "Black";
    
    renderMoveTable();
    drawGraph(fullEvals);
    if (analysisMoves.length > 0) showAnalysisMove(0);
  } catch (e) { 
    alert('Ошибка: ' + e.message); 
    document.getElementById('evalText').textContent = '0.0';
    document.getElementById('topLinesList').innerHTML = 'Ошибка';
  }
  finally { isAnalyzing = false; }
}

function handleAnalysisDrop(source, target) {
  if (isAnalyzing) return 'snapback';
  const move = analysisGame.move({ from: source, to: target, promotion: 'q' });
  if (!move) return 'snapback';

  playMoveSound();
  analysisBoard.position(analysisGame.fen());
  document.querySelectorAll('#moveTableBody tr').forEach(tr => tr.classList.remove('active'));
  
  evaluateCurrentPosition(analysisGame.fen());
}

function formatEvalString(isMate, mateIn, evalScore) {
  if (isMate) return (mateIn > 0 ? "М" : "-М") + Math.abs(mateIn);
  return (evalScore > 0 ? '+' : '') + evalScore.toFixed(1);
}

function updateEvalBar(isMate, mateIn, evalScore) {
  let whitePercent = 50;
  if (isMate) whitePercent = mateIn > 0 ? 100 : 0;
  else whitePercent = Math.max(0, Math.min(100, 50 + (evalScore * 5)));
  
  document.getElementById('evalBarWhite').style.height = whitePercent + '%';
  document.getElementById('evalText').textContent = formatEvalString(isMate, mateIn, evalScore);
}

async function evaluateCurrentPosition(fen) {
  document.getElementById('evalText').textContent = '...';
  document.getElementById('topLinesList').innerHTML = 'Анализ позиции...';
  try {
    const res = await fetch('/api/evaluate', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({fen})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail);
    
    updateEvalBar(data.is_mate, data.mate_in, data.eval);
    updatePlayerNamesAndMaterial(fen);
    
    if (data.top_moves) {
      renderTopLines(data.top_moves);
      drawArrows(data.top_moves);
    }
  } catch (e) {
    document.getElementById('evalText').textContent = 'Error';
  }
}

function renderTopLines(lines) {
  const container = document.getElementById('topLinesList');
  if (!lines || lines.length === 0) { container.innerHTML = 'Нет данных'; return; }
  
  container.innerHTML = lines.map((line, idx) => `
    <div class="top-line" onclick="playTopMove('${line.uci}')" title="Сделать ход">
      <span class="top-line-move" style="color: ${idx === 0 ? '#4ade80' : (idx === 1 ? '#3b82f6' : '#a855f7')}">${idx + 1}. ${line.san}</span>
      <span class="top-line-pv">${line.pv}</span>
      <span class="top-line-eval">${formatEvalString(line.is_mate, line.mate_in, line.eval)}</span>
    </div>
  `).join('');
}

window.playTopMove = function(uci) {
  if (isAnalyzing) return;
  const from = uci.slice(0, 2);
  const to = uci.slice(2, 4);
  const promotion = uci.length > 4 ? uci[4] : 'q';
  
  const move = analysisGame.move({ from, to, promotion });
  if (!move) return;

  playMoveSound();
  analysisBoard.position(analysisGame.fen());
  document.querySelectorAll('#moveTableBody tr').forEach(tr => tr.classList.remove('active'));
  document.getElementById('arrowOverlay').innerHTML = '';

  evaluateCurrentPosition(analysisGame.fen());
};

function renderMoveTable() {
  const tbody = document.getElementById('moveTableBody'); tbody.innerHTML = '';
  const classSymbols = {
    'brilliant': { text: '!!', title: 'Бриллиантовый ход' },
    'great': { text: '!', title: 'Великий ход' },
    'best': { text: '★', title: 'Лучший ход' },
    'excellent': { text: '✓', title: 'Отличный ход' },
    'good': { text: '✓', title: 'Хороший ход' },
    'inaccuracy': { text: '?!', title: 'Неточность' },
    'mistake': { text: '?', title: 'Ошибка' },
    'miss': { text: '✗', title: 'Упущенная победа' },
    'blunder': { text: '??', title: 'Зевок' },
    'forced': { text: '□', title: 'Единственный ход' },
    'book': { text: '📖', title: 'Теория' }
  };

  analysisMoves.forEach((m, idx) => {
    const tr = document.createElement('tr'); tr.id = `move-row-${idx}`; tr.onclick = () => showAnalysisMove(idx);
    const sym = classSymbols[m.classification] || { text: m.classification, title: '' };
    const evalStr = formatEvalString(m.is_mate, m.mate_in, m.eval);
    tr.innerHTML = `<td>${m.move_num}</td><td>${m.san}</td><td>${evalStr}</td><td><span class="move-class-badge cls-${m.classification}" title="${sym.title}">${sym.text}</span></td>`;
    tbody.appendChild(tr);
  });
}

function showAnalysisMove(index) {
  if (index < 0 || index >= analysisMoves.length) return;
  
  document.querySelectorAll('#moveTableBody tr').forEach(tr => tr.classList.remove('active'));
  const row = document.getElementById(`move-row-${index}`);
  if (row) { row.classList.add('active'); row.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  
  const move = analysisMoves[index];
  analysisGame.load(move.fen);
  
  playMoveSound();
  analysisBoard.position(move.fen);
  
  document.querySelectorAll('.brilliant-anim, .excellent-anim').forEach(el => {
    el.classList.remove('brilliant-anim', 'excellent-anim');
  });

  if (move.classification === 'brilliant' || move.classification === 'great' || move.classification === 'excellent') {
    const history = analysisGame.history({ verbose: true });
    if (history.length > 0) {
      const lastMove = history[history.length - 1];
      const squareEl = document.querySelector(`.square-${lastMove.to}`);
      if (squareEl) {
        squareEl.classList.add(move.classification === 'brilliant' ? 'brilliant-anim' : 'excellent-anim');
        setTimeout(() => { squareEl.classList.remove('brilliant-anim', 'excellent-anim'); }, 2000);
      }
    }
  }

  updateEvalBar(move.is_mate, move.mate_in, move.eval);
  updatePlayerNamesAndMaterial(move.fen);
  
  if (move.next_top_moves) {
    renderTopLines(move.next_top_moves);
    drawArrows(move.next_top_moves);
  } else {
    document.getElementById('topLinesList').innerHTML = 'Нет данных';
    document.getElementById('arrowOverlay').innerHTML = '';
  }
  
  currentAnalysisIndex = index;
}

// Кнопки навигации по партии в анализе
document.getElementById('analysisStart').onclick = () => showAnalysisMove(0);
document.getElementById('analysisPrev').onclick = () => { if (currentAnalysisIndex > 0) showAnalysisMove(currentAnalysisIndex - 1); };
document.getElementById('analysisNext').onclick = () => { if (currentAnalysisIndex < analysisMoves.length - 1) showAnalysisMove(currentAnalysisIndex + 1); };
document.getElementById('analysisEnd').onclick = () => { if (analysisMoves.length > 0) showAnalysisMove(analysisMoves.length - 1); };
</script>
</body>
