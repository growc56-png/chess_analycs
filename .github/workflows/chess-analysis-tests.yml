name: Chess analysis tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  move-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis test dependencies
        run: python -m pip install --upgrade pip python-chess python-dotenv fastapi
      - name: Run Python regression tests and compile checks
        working-directory: backend
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q .
      - name: Prevent secrets and database files from entering Git
        run: |
          forbidden=$(git ls-files | grep -E '(^|/)\\.env($|\\.)|\\.(db|sqlite|sqlite3)          node --check front/js/index.js
          node --check front/js/bots.js
          node --check front/js/coach.js
          node --check front/js/errors.js
          node --check front/js/openings-data.js
          node --check front/js/openings-training.js
 | grep -v -E '(^|/)\\.env\\.example          node --check front/js/index.js
          node --check front/js/bots.js
          node --check front/js/coach.js
          node --check front/js/errors.js
          node --check front/js/openings-data.js
          node --check front/js/openings-training.js
 || true)
          if [ -n "$forbidden" ]; then
            echo "Sensitive/local files must not be committed:"
            echo "$forbidden"
            exit 1
          fi
      - name: Check installer and frontend syntax
        run: |
          python -m py_compile scripts/install_stockfish.py
          node --check front/js/index.js
          node --check front/js/bots.js
          node --check front/js/coach.js
          node --check front/js/errors.js
          node --check front/js/openings-data.js
          node --check front/js/openings-training.js
