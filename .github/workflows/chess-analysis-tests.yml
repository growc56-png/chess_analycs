name: Chess analysis tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  move-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis test dependencies
        run: python -m pip install --upgrade pip python-chess python-dotenv fastapi
      - name: Run Python regression tests and compile checks
        working-directory: backend
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q .
      - name: Prevent secrets and database files from entering Git
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import PurePosixPath

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden = []
          for value in tracked:
              path = PurePosixPath(value)
              name = path.name
              is_env_example = name == ".env.example"
              is_env_file = name == ".env" or (name.startswith(".env.") and not is_env_example)
              is_database = path.suffix.lower() in {".db", ".sqlite", ".sqlite3"}
              if is_env_file or is_database:
                  forbidden.append(value)

          if forbidden:
              print("Sensitive/local files must not be committed:")
              print("\\n".join(forbidden))
              sys.exit(1)
          PY
      - name: Check installer and frontend syntax
        run: |
          python -m py_compile scripts/install_stockfish.py
          node --check front/js/index.js
          node --check front/js/bots.js
          node --check front/js/coach.js
          node --check front/js/errors.js
          node --check front/js/openings-data.js
          node --check front/js/openings-training.js
