<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Практика матов</title>
<link rel="stylesheet" href="/css/chessboard-1.0.0.min.css">
<script src="/js/jquery.min.js"></script>
<script src="/js/chessboard-1.0.0.min.js"></script>
<script src="/js/chess.min.js"></script>
<script src="/shared.js"></script>
<script src="/mates.js" defer></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #312e2b; color: #e2e2e2; }
  .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  h1 { font-size: 24px; margin: 0; color: #fff; font-weight: 700; }
  a { color: #81b64c; text-decoration: none; font-size: 14px; font-weight: 600; }
  a:hover { text-decoration: underline; }

  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 20px; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

  .list-box { background: #262522; border-radius: 8px; padding: 10px; }
  .list-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; color: #b3b3b3; margin-bottom: 2px; display: flex; justify-content: space-between; }
  .list-item:hover { background: #3d3a37; color: #fff; }
  .list-item.active { background: #4b4847; color: #fff; }
  .record-time { color: #81b64c; font-size: 12px; }

  .board-area { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #mateBoard { width: 550px; max-width: 100%; box-shadow: 0 10px 20px rgba(0,0,0,0.4); border-radius: 4px; overflow: hidden; }

  .timer { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; background: #262522; padding: 8px 24px; border-radius: 8px; min-width: 130px; text-align: center; color: #81b64c; box-shadow: 0 3px 0 rgba(0,0,0,0.2); }
  .timer.low { color: #ef4444; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.55; } }

  .feedback { font-size: 16px; font-weight: 600; min-height: 24px; text-align: center; }
  .feedback.ok { color: #81b64c; }
  .feedback.err { color: #ef4444; }
  .feedback.info { color: #fcd34d; }

  .btn-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;}
  .action-btn { background: #3d3a37; border: none; color: #fff; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .action-btn:hover { background: #4b4847; }
  .action-btn.primary { background: #81b64c; color: #fff; box-shadow: 0 3px 0 #537133; transition: 0.1s; }
  .action-btn.primary:hover { background: #a3d160; }
  .action-btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 #537133; }

  .time-input { width: 70px; background: #262522; border: none; color: #fff; padding: 10px; border-radius: 6px; text-align: center; font-size: 16px; font-weight: bold; }
  .time-input:disabled { opacity: 0.5; cursor: not-allowed; }

  .desc { color: #b3b3b3; font-size: 13px; text-align: center; max-width: 480px; line-height: 1.5; }

  .white-1e1d7 { background-color: #EBECD0 !important; color: #779556 !important; }
  .black-3c85d { background-color: #779556 !important; color: #EBECD0 !important; }

  .square-55d63 { position: relative; }
  .move-hint::after { content: ''; position: absolute; top: 50%; left: 50%; width: 30%; height: 30%; background: rgba(0, 0, 0, 0.2); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
  .capture-hint::after { content: ''; position: absolute; top: 5%; left: 5%; width: 90%; height: 90%; border: 5px solid rgba(0, 0, 0, 0.2); border-radius: 50%; pointer-events: none; z-index: 10; }

  .premove-from::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(239, 68, 68, 0.5); z-index: 1; pointer-events: none; }
  .premove-to::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(239, 68, 68, 0.8); z-index: 1; pointer-events: none; }

  .board-area { -webkit-user-select: none; user-select: none; }
  #mateBoard img { -webkit-user-drag: none; user-drag: none; }
  .overlay-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 2000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; }
  .modal-overlay.active { display: flex; opacity: 1; }
  .modal-content { background: #262522; padding: 30px 40px; border-radius: 12px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #3d3a37; color: #fff; transform: translateY(20px); transition: transform 0.3s; min-width: 350px; }
  .modal-overlay.active .modal-content { transform: translateY(0); }
  .modal-content h2 { font-size: 28px; margin: 0 0 20px; font-weight: 700; }
  .modal-content h2.win { color: #81b64c; }
  .modal-content h2.loss { color: #ef4444; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Практика матов</h1>
    <a href="/">← Назад к тренажёру</a>
  </div>

  <div class="layout">
    <div class="list-box" id="mateList"></div>
    <div class="board-area" oncontextmenu="return false;">
      <div class="timer" id="timer">30.0</div>
      <div style="position: relative;">
        <div id="mateBoard"></div>
        <svg id="userDraw_mateBoard" class="overlay-svg" viewBox="0 0 8 8" preserveAspectRatio="none"></svg>
      </div>
      
      <div class="feedback" id="mateFeedback">Выбери позицию слева</div>
      <div class="desc" id="mateDesc"></div>
      
      <div class="btn-row">
        <input type="number" id="timeInput" class="time-input" value="30" min="5" max="300" title="Время в секундах">
        <button class="action-btn primary" id="mainBtn">▶ Старт</button>
        <button class="action-btn" id="hintBtn">💡 Подсказка</button>
      </div>
    </div>
  </div>
</div>

<div id="mateModal" class="modal-overlay">
  <div class="modal-content">
    <h2 id="modalMateResult">Мат!</h2>
    <div class="modal-buttons" style="margin-top: 20px;">
      <button class="action-btn primary" id="modalMateRetryBtn" style="background:#81b64c; color:#fff; padding:10px 20px; border:none; border-radius:6px; box-shadow:0 3px 0 #537133; cursor:pointer; font-weight:bold;">Заново</button>
      <button class="action-btn" id="modalMateCloseBtn" style="background:#3d3a37; color:#fff; padding:10px 20px; border:none; border-radius:6px; box-shadow:0 3px 0 #262522; cursor:pointer; font-weight:bold;">Закрыть</button>
    </div>
  </div>
</div>

</body>
</html>
