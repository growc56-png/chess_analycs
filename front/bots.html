<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игра с ботами</title>
<link rel="stylesheet" href="/css/chessboard-1.0.0.min.css">
<script src="/js/jquery.min.js"></script>
<script src="/js/chessboard-1.0.0.min.js"></script>
<script src="/js/chess.min.js"></script>
<script src="/shared.js"></script>
<script src="/bots.js" defer></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #312e2b; color: #e2e2e2; }
  .container { max-width: 800px; margin: 0 auto; padding: 20px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  h1 { font-size: 24px; margin: 0; color: #fff; font-weight: 700; }
  a { color: #81b64c; text-decoration: none; font-size: 14px; font-weight: 600; }
  a:hover { text-decoration: underline; }

  .controls { display: flex; gap: 10px; margin-bottom: 20px; background: #262522; padding: 15px; border-radius: 8px; align-items: center; flex-wrap: wrap; font-size: 14px;}
  .controls select, .controls button { background: #3d3a37; border: none; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; outline: none; }
  .controls select:hover, .controls button:hover { background: #4b4847; }
  .controls button.primary { background: #81b64c; color: #fff; border: none; box-shadow: 0 3px 0 #537133; transition: 0.1s; }
  .controls button.primary:hover { background: #a3d160; }
  .controls button.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 #537133; }

  .game-area { display: flex; flex-direction: column; align-items: center; gap: 10px; position: relative; }
  
  .board-container { display: flex; gap: 15px; align-items: stretch; }
  .eval-bar { width: 20px; background: #262522; border-radius: 4px; position: relative; overflow: hidden; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }
  .eval-white { position: absolute; bottom: 0; width: 100%; background: #f0f0f0; transition: height 0.3s; height: 50%; }
  
  .board-wrapper { position: relative; width: 600px; max-width: 100%; }
  #botBoard { width: 100%; box-shadow: 0 10px 20px rgba(0,0,0,0.4); border-radius: 4px; overflow: hidden; }
  
  .overlay-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

  .player-info { width: 600px; max-width: 100%; background: #262522; padding: 10px 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; }
  .player-info .name { color: #fff; display: flex; align-items: center; gap: 10px; }
  .player-info .captured { font-size: 18px; color: #b3b3b3; letter-spacing: -2px; margin-left: 5px; }
  .player-info .adv { color: #81b64c; font-weight: 700; }
  
  .clock { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; background: #3d3a37; padding: 4px 12px; border-radius: 6px; color: #b3b3b3; transition: 0.2s; min-width: 90px; text-align: center; }
  .clock.active { background: #f0f0f0; color: #111; box-shadow: 0 0 10px rgba(255,255,255,0.3); }
  .clock.low { background: #d95c5c; color: #fff; }

  .status { font-size: 16px; font-weight: 600; background: #262522; padding: 12px 20px; border-radius: 6px; border-left: 4px solid #81b64c; width: 635px; max-width: 100%; text-align: center; }
  .status.thinking { border-left-color: #f59e0b; color: #fcd34d; }
  .status.gameover { border-left-color: #ef4444; color: #fca5a5; }

  .square-55d63 { position: relative; }
  .move-hint::after { content: ''; position: absolute; top: 50%; left: 50%; width: 30%; height: 30%; background: rgba(0, 0, 0, 0.2); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
  .capture-hint::after { content: ''; position: absolute; top: 5%; left: 5%; width: 90%; height: 90%; border: 5px solid rgba(0, 0, 0, 0.2); border-radius: 50%; pointer-events: none; z-index: 10; }

  /* НАДЕЖНЫЕ КРАСНЫЕ КВАДРАТЫ ПРЕМУВА (ИСПРАВЛЕНО) */
  .square-55d63 { position: relative; }
  .square-55d63 img { position: relative; z-index: 10 !important; }
  
  .premove-from::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-color: rgba(239, 68, 68, 0.5); z-index: 99 !important; pointer-events: none;
  }
  .premove-to::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-color: rgba(239, 68, 68, 0.9); z-index: 99 !important; pointer-events: none;
  }

  .white-1e1d7 { background-color: #EBECD0 !important; color: #779556 !important; }
  .black-3c85d { background-color: #779556 !important; color: #EBECD0 !important; }
  
  .game-area { -webkit-user-select: none; user-select: none; }
  #botBoard img { -webkit-user-drag: none; user-drag: none; }

  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 2000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; }
  .modal-overlay.active { display: flex; opacity: 1; }
  .modal-content { background: #262522; padding: 30px 40px; border-radius: 12px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #3d3a37; color: #fff; transform: translateY(20px); transition: transform 0.3s; min-width: 350px; }
  .modal-overlay.active .modal-content { transform: translateY(0); }
  .modal-content h2 { font-size: 28px; margin: 0 0 20px; font-weight: 700; }
  .modal-content h2.win { color: #81b64c; }
  .modal-content h2.loss { color: #ef4444; }
  .modal-content h2.draw { color: #8b8987; }
  .modal-buttons { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Игра с ботами</h1>
    <a href="/">← Назад к тренажёру</a>
  </div>

  <div class="controls">
    <label>Уровень:</label>
    <select id="botLevel">
      <option value="1">1 - Новичок (800)</option>
      <option value="2">2 - Легкий (1000)</option>
      <option value="3" selected>3 - Средний (1200)</option>
      <option value="4">4 - Сложный (1500)</option>
      <option value="5">5 - Опытный (1800)</option>
      <option value="6">6 - Мастер (2000+)</option>
    </select>
    
    <label>Сторона:</label>
    <select id="sideSelect">
      <option value="w">♔ Белые</option>
      <option value="b">♚ Чёрные</option>
      <option value="random">🎲 Наугад</option>
    </select>

    <label>Время:</label>
    <select id="timeControl">
      <option value="unlimited">∞ Без времени</option>
      <option value="1+0">1+0 (Пуля)</option>
      <option value="3+2">3+2 (Блиц)</option>
      <option value="5+0">5+0 (Блиц)</option>
    </select>

    <button class="primary" id="newGameBtn">Новая игра</button>
  </div>

  <div class="game-area" oncontextmenu="return false;">
    
    <div id="topPlayer" class="player-info">
      <div class="name"><span id="topName">Бот</span> <span class="captured" id="botCaptured"></span></div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="adv" id="botAdv"></div>
        <div class="clock" id="botClock">∞</div>
      </div>
    </div>
    
    <div class="board-container">
      <div class="eval-bar"><div class="eval-white" id="evalBarWhite"></div></div>
      <div class="board-wrapper" id="boardWrapper">
        <div id="botBoard"></div>
        <svg id="userDraw_botBoard" class="overlay-svg" viewBox="0 0 8 8" preserveAspectRatio="none"></svg>
      </div>
    </div>
    
    <div id="bottomPlayer" class="player-info">
      <div class="name"><span id="bottomName">Ты</span> <span class="captured" id="playerCaptured"></span></div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="adv" id="playerAdv"></div>
        <div class="clock" id="playerClock">∞</div>
      </div>
    </div>
    
    <div class="status" id="gameStatus" style="margin-top: 10px;">Нажми «Новая игра».</div>
    
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="action-btn" id="resignBtn" style="background:#d95c5c; color:#fff; box-shadow:0 3px 0 #9e3e3e; padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">🏳️ Сдаться</button>
      <button class="action-btn" id="drawBtn" style="background:#8b8987; color:#fff; box-shadow:0 3px 0 #63615f; padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">🤝 Ничья</button>
      <button class="action-btn" id="downloadPgnBtn" style="background:#3d3a37; color:#fff; box-shadow:0 3px 0 #262522; padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">💾 Скачать PGN</button>
    </div>
  </div>
</div>

<div id="gameOverModal" class="modal-overlay">
  <div class="modal-content">
    <h2 id="modalResult">Мат!</h2>
    <div class="modal-buttons" style="margin-top: 20px;">
      <button class="action-btn primary" id="modalRematchBtn" style="background:#81b64c; color:#fff; padding:10px 20px; border:none; border-radius:6px; box-shadow:0 3px 0 #537133; cursor:pointer; font-weight:bold;">Играть снова</button>
      <button class="action-btn" id="modalCloseBtn" style="background:#3d3a37; color:#fff; padding:10px 20px; border:none; border-radius:6px; box-shadow:0 3px 0 #262522; cursor:pointer; font-weight:bold;">Закрыть</button>
    </div>
  </div>
</div>

</body>
</html>
